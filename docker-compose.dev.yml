# One local check against the account API, with the Python sources mounted from this directory.
# There is no browser. Leave the published compose file for the long-running checker.
#
#   docker compose -f docker-compose.dev.yml run --rm --build pickmypostcode-checker
#   docker compose -f docker-compose.dev.yml run --rm --build pickmypostcode-checker python run.py --test

services:
  pickmypostcode-checker:
    build: .
    env_file: .env
    environment:
      - TZ=Europe/London
    volumes:
      - ./pickmypostcode_logs:/app/logs
      - ./accountCheck.py:/app/accountCheck.py
      - ./draws.py:/app/draws.py
      - ./healthCheck.py:/app/healthCheck.py
      - ./history.py:/app/history.py
      - ./run.py:/app/run.py
      - ./scheduler.py:/app/scheduler.py
      - ./sendEmail.py:/app/sendEmail.py
      - ./summariseWeeklyResults.py:/app/summariseWeeklyResults.py
    working_dir: /app
    command: ["python", "run.py"]
    restart: "no"
